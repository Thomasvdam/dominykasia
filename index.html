<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Swipe through photos. Like, pass, or undo.">
  <title>friendzone.</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 3 3 8l5 5M3 8h10a7 7 0 1 1 0 14"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="m17 3 4 4-4 4M3 17l4-1 10-9h4M17 13l4 4-4 4M3 7l4 1 3 3m4 3 3 3h4"/></symbol>
  </svg>
  <div class="app-shell">
    <header class="header">
      <h1>friendzone<span>.</span></h1>
      <span class="liked-count" aria-label="Liked photos"><svg aria-hidden="true"><use href="#i-heart"/></svg><span id="favorites-count">0</span></span>
    </header>
    <main>
      <section class="deck-view" id="deck-view" aria-label="Photo deck">
        <div class="card-stack" id="card-stack">
          <div class="back-card back-two"></div><div class="back-card back-one"></div>
          <article class="photo-card" id="photo-card" tabindex="0" aria-label="Photo card. Swipe or use left and right arrow keys.">
            <img id="card-photo" alt="" draggable="false" fetchpriority="high">
            <div class="image-fallback" id="image-fallback" hidden><p>Photo unavailable</p><small>Skip to the next one.</small></div>
            <div class="card-shade"></div>
            <div class="card-top"><span class="photo-badge" id="photo-badge" hidden>DEMO</span><span class="card-number" id="card-number"></span></div>
            <div class="swipe-stamp stamp-like" id="stamp-like">LIKE</div><div class="swipe-stamp stamp-pass" id="stamp-pass">NOPE</div>
            <h2 class="photo-title" id="photo-title"></h2>
          </article>
          <div class="empty-deck" id="empty-deck" hidden>
            <h2>All caught up</h2>
            <button class="primary-button" id="restart">Start again <svg aria-hidden="true"><use href="#i-undo"/></svg></button>
          </div>
        </div>
        <div class="controls" role="group" aria-label="Photo actions">
          <button class="control small" id="undo" aria-label="Undo last swipe" title="Undo last swipe" disabled><svg aria-hidden="true"><use href="#i-undo"/></svg></button>
          <button class="control pass" id="pass" aria-label="Pass on this photo" title="Pass (left arrow)"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
          <button class="control like" id="like" aria-label="Like this photo" title="Like (right arrow)"><svg aria-hidden="true"><use href="#i-heart"/></svg></button>
          <button class="control small" id="shuffle" aria-label="Shuffle remaining photos" title="Shuffle remaining photos"><svg aria-hidden="true"><use href="#i-shuffle"/></svg></button>
        </div>
        <div class="deck-progress"><span id="progress-label"></span><div class="progress-track"><div id="progress-fill"></div></div></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
