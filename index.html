<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="One friend. Infinite anime final forms. Swipe through an endless multiverse of over-the-top portraits and absurd anime lore.">
  <meta name="application-name" content="Dominykasia">
  <link rel="canonical" href="https://dominyk.asia/">
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32" type="image/x-icon">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="./site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dominykasia">
  <meta property="og:title" content="Dominykasia — Infinite final forms">
  <meta property="og:description" content="One friend. Infinite anime final forms. Swipe through an endless multiverse of over-the-top portraits and absurd anime lore.">
  <meta property="og:url" content="https://dominyk.asia/">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://dominyk.asia/assets/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Dominykasia: One friend. Infinite final forms. Anime samurai and magical idol photo cards with a heart.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dominykasia — Infinite final forms">
  <meta name="twitter:description" content="One friend. Infinite anime final forms. Swipe through an endless multiverse of over-the-top portraits and absurd anime lore.">
  <meta name="twitter:image" content="https://dominyk.asia/assets/social-preview.png">
  <meta name="twitter:image:alt" content="Dominykasia: One friend. Infinite final forms. Anime samurai and magical idol photo cards with a heart.">
  <title>Dominykasia</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </svg>
  <div class="app-shell">
    <header class="header">
      <h1>Dominykasia</h1>
      <span class="liked-count" aria-label="Liked photos"><svg aria-hidden="true"><use href="#i-heart"/></svg><span id="favorites-count">0</span></span>
    </header>
    <main>
      <section class="deck-view" id="deck-view" aria-label="Photo deck">
        <div class="card-stack" id="card-stack">
          <div class="back-card back-two"></div><div class="back-card back-one"></div>
          <article class="photo-card" id="photo-card" tabindex="0" aria-label="Photo card. Swipe or use left and right arrow keys.">
            <img id="card-photo" alt="" draggable="false" fetchpriority="high">
            <div class="image-fallback" id="image-fallback" hidden><p>Photo unavailable</p><small>Skip to the next one.</small></div>
            <div class="card-shade"></div>
            <div class="card-top"><span class="photo-badge" id="photo-badge" hidden>DEMO</span></div>
            <div class="swipe-stamp stamp-like" id="stamp-like">LIKE</div><div class="swipe-stamp stamp-pass" id="stamp-pass">NOPE</div>
            <div class="photo-caption"><h2 class="photo-title" id="photo-title"></h2><p class="photo-blurb" id="photo-blurb"></p></div>
          </article>
          <div class="empty-deck" id="empty-deck" hidden>
            <h2>No photos yet</h2>
          </div>
        </div>
        <div class="controls" role="group" aria-label="Photo actions">
          <button class="control pass" id="pass" aria-label="Pass on this photo" title="Pass (left arrow)"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
          <button class="control like" id="like" aria-label="Like this photo" title="Like (right arrow)"><svg aria-hidden="true"><use href="#i-heart"/></svg></button>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
