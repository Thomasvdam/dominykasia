<!doctype html>
<html lang="en">

<title>Dominykasia branding artwork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#f7f5ef;color:#282a24}.social{position:relative;width:1200px;height:630px;overflow:hidden;background:#f7f5ef}.brand{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:15px}.brand img{width:52px;height:52px}.brand span{font-size:17px;font-weight:700;letter-spacing:3px}.copy{position:absolute;left:64px;top:179px;width:565px;z-index:3}h1{font-size:72px;line-height:1;letter-spacing:-4px;margin:0 0 31px;font-weight:800}.tagline{font-size:37px;line-height:1.2;letter-spacing:-1px;margin:0;font-weight:500}.tagline span{color:#c65c35}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #b5b8a9;padding:9px 13px;border-radius:30px;font-size:12px;letter-spacing:1.7px;font-weight:700;margin-top:33px}.pill:before{content:'';width:6px;height:6px;border-radius:50%;background:#ef754b}.bottom{position:absolute;left:64px;bottom:53px;font-size:15px;color:#6d7165}.bottom span{padding:0 12px;color:#ef754b}.orbit{position:absolute;right:-85px;top:24px;width:635px;height:635px;border-radius:50%;background:#e9e6d9;border:1px solid #ddd9ca}.card{position:absolute;overflow:hidden;width:270px;height:414px;border-radius:19px;border:7px solid #fff;box-shadow:0 18px 40px #282a2430;background:#ded7c7}.card img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}.samurai{left:649px;top:79px;transform:rotate(-10deg)}.idol{left:866px;top:135px;transform:rotate(10deg)}.heart{position:absolute;left:814px;top:464px;width:86px;height:86px;border:6px solid #f7f5ef;border-radius:50%;display:grid;place-items:center;background:#ef754b;color:#fff;box-shadow:0 8px 22px #282a2420;transform:rotate(-10deg)}.heart svg{width:39px;height:39px;fill:currentColor}.sparkle{position:absolute;left:1106px;top:61px;color:#c65c35;font-size:49px}.icon{display:none;width:100vw;height:100vh}body.icon-only .social{display:none}body.icon-only .icon{display:block}
</style>

</div>
